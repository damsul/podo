spring:
  datasource:
    url: jdbc:mysql://podo-db.c50ekmssgq45.ap-northeast-2.rds.amazonaws.com:3306/pododb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME} # 환경변수로 관리
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update # 운영은 validate (자동 변경 금지)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  forward-headers-strategy: native

logging:
  level:
    com.podo: INFO
