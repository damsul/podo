spring:
  datasource:
    # 운영 DB는 EC2 내부 MySQL (외부 접속 차단)
    # 서버에서는 환경변수 SPRING_DATASOURCE_URL이 이 값보다 우선 적용됨
    url: jdbc:mysql://localhost:3306/pododb?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME} # 환경변수로 관리
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 1인 운영이라 엔티티 변경을 update로 반영하고, 매일 mysqldump 백업으로 보완
      # 실서비스라면 validate + 마이그레이션 도구(Flyway 등)로 스키마를 직접 관리
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  forward-headers-strategy: native

logging:
  level:
    com.podo: INFO