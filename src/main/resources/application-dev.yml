spring:
  datasource:
    url: jdbc:h2:mem:pododb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true # http://localhost:8080/h2-console
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop # 개발 중 매번 초기화
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.podo: DEBUG
    org.hibernate.SQL: DEBUG
    org.springdoc: TRACE
    org.springframework.web: DEBUG
    io.swagger: DEBUG
    org.springframework.security: DEBUG