<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Podo - 내 페이방</title>
  <link rel="stylesheet" th:href="@{/css/common.css}"/>
  <link rel="stylesheet" th:href="@{/css/home.css}"/>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container" th:if="${isLoggedIn}">

  <div class="greeting">
    안녕하세요, <span class="name" th:text="${userName}">경환</span>님 👋
  </div>

  <div class="section-header">
    <h2 class="section-title">내 페이방</h2>
    <a href="/rooms/new" class="create-button">+ 새 방 만들기</a>
  </div>

  <!-- 페이방이 있을 때 -->
  <div class="room-list" th:if="${!rooms.isEmpty()}">
    <a th:each="room : ${rooms}"
       th:href="@{/rooms/{id}(id=${room.id})}"
       class="room-card">

      <div class="room-title" th:text="${room.title}">방 제목</div>

      <div class="room-meta">
                <span class="status-badge"
                      th:classappend="${room.status.name() == 'IN_PROGRESS'} ? 'status-in-progress' : 'status-completed'"
                      th:text="${room.status.name() == 'IN_PROGRESS'} ? '진행 중' : '정산 완료'">
                    진행 중
                </span>

        <span th:if="${room.dueDate != null}">
                    · 마감 <span th:text="${#temporals.format(room.dueDate, 'yyyy.MM.dd')}">2026.06.12</span>
                </span>

        <span>· 방장: <span th:text="${room.ownerName}">최경환</span></span>
      </div>
    </a>
  </div>

  <!-- 페이방이 없을 때 -->
  <div class="empty-state" th:if="${rooms.isEmpty()}">
    <div class="empty-icon">🍇</div>
    <p>아직 페이방이 없어요</p>
    <p>새 방을 만들어 더치페이를 시작해보세요!</p>
  </div>

</div>

<!-- 비로그인 -->
<div class="container guest-container" th:unless="${isLoggedIn}">
  <div class="guest-welcome">
    <div class="empty-icon">🍇</div>
    <h2 class="guest-title">더치페이, Podo와 함께 시작하세요</h2>
    <p class="guest-desc">방을 만들고 정산까지 한 번에 관리해보세요.</p>
    <a href="/login" class="create-button guest-login-button">로그인하고 시작하기</a>
  </div>
</div>

</body>
</html>
