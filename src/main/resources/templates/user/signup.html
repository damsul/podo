<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원가입 - Podo</title>
  <link rel="stylesheet" th:href="@{/css/signup.css}"/>
</head>
<body>
<div class="signup-container">
  <div class="logo">🍇</div>
  <h2 class="title">Podo 회원가입</h2>

  <form th:action="@{/signup}" th:object="${signupRequest}" method="post">

    <div class="form-group">
      <label for="loginId">아이디</label>
      <input type="text" id="loginId" th:field="*{loginId}"
             placeholder="영문, 숫자 4~20자">
      <div class="error" th:if="${#fields.hasErrors('loginId')}"
           th:errors="*{loginId}">아이디 오류</div>
    </div>

    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" th:field="*{password}"
             placeholder="8~20자">
      <div class="error" th:if="${#fields.hasErrors('password')}"
           th:errors="*{password}">비밀번호 오류</div>
    </div>

    <div class="form-group">
      <label for="name">이름</label>
      <input type="text" id="name" th:field="*{name}"
             placeholder="이름을 입력하세요">
      <div class="error" th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}">이름 오류</div>
    </div>

    <div class="form-group">
      <label for="email">이메일 (선택)</label>
      <input type="email" id="email" th:field="*{email}"
             placeholder="example@email.com">
      <div class="error" th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}">이메일 오류</div>
    </div>

    <button type="submit" class="submit-button">가입하기</button>
  </form>

  <div class="login-link">
    이미 계정이 있으신가요? <a href="/login">로그인</a>
  </div>
</div>
</body>
</html>
