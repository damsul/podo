<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>가입 완료 - Podo</title>
  <link rel="stylesheet" th:href="@{/css/signup-complete.css}"/>
</head>
<body>
<div class="complete-container">
  <div class="icon">🎉</div>
  <h2 class="title">가입을 축하합니다!</h2>
  <p class="message">
    <span class="highlight" th:text="${userName}">경환</span>님,
    Podo의 멤버가 되신 것을 환영합니다 🍇
  </p>
  <a href="/login" class="login-button">로그인하러 가기</a>
</div>
</body>
</html>
