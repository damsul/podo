<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>오류 발생 - Podo</title>
    <link rel="stylesheet" th:href="@{/css/common.css}"/>
    <link rel="stylesheet" th:href="@{/css/error.css}"/>
</head>
<body>
<div class="error-container">
    <div class="error-icon">🍇</div>
    <p class="error-status" th:text="${status}">500</p>
    <p class="error-message" th:text="${message}">오류가 발생했습니다</p>
    <p class="error-code" th:text="'오류 코드: ' + ${code}">오류 코드: C002</p>
    <a href="/" class="home-button">홈으로 돌아가기</a>
</div>
</body>
</html>
