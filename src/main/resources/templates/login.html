<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>로그인 - Podo</title>
  <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>
<div class="login-container">
  <a href="/" class="home-link">← 홈으로</a>

  <div class="logo">🍇</div>
  <h2 class="title">Podo 로그인</h2>

  <!-- 로그인 실패 시 에러 메시지 -->
  <div class="error-message" th:if="${param.error}">
    아이디 또는 비밀번호가 올바르지 않습니다
  </div>

  <!-- 로그아웃 후 메시지 -->
  <div class="error-message" th:if="${param.logout}"
       style="background-color: #eafaf1; color: #27ae60;">
    로그아웃 되었습니다
  </div>

  <form th:action="@{/login}" method="post">

    <div class="form-group">
      <label for="loginId">아이디</label>
      <input type="text" id="loginId" name="loginId"
             placeholder="아이디를 입력하세요" autofocus>
    </div>

    <div class="form-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" name="password"
             placeholder="비밀번호를 입력하세요">
    </div>

    <button type="submit" class="login-button">로그인</button>
  </form>

  <div class="divider">
    <span>또는</span>
  </div>

  <a href="/oauth2/authorization/kakao" class="kakao-button">
    <span>💬</span> 카카오로 로그인
  </a>

  <a href="/oauth2/authorization/google" class="google-button">
    <span>🌐</span> Google로 로그인
  </a>

  <a href="/oauth2/authorization/naver" class="naver-button">
    <span>🟢</span> 네이버로 로그인
  </a>

  <div class="signup-link">
    아직 계정이 없으신가요? <a href="/signup">회원가입</a>
  </div>
</div>
</body>
</html>
