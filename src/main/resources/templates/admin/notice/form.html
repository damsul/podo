<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>공지사항 등록 - Podo Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-content">
        <div class="admin-form-header">
            <h2 class="admin-form-title">공지사항 등록</h2>
            <div class="admin-form-actions">
                <a href="/admin/notices" class="admin-cancel-button">취소</a>
                <button type="submit" form="noticeCreateForm" class="admin-save-button">저장</button>
            </div>
        </div>
        <div class="admin-form-divider"></div>

        <form id="noticeCreateForm" th:action="@{/admin/notices}" th:object="${noticeCreateRequest}" method="post">

            <div class="admin-field-row align-start">
                <span class="admin-field-label with-padding">제목</span>
                <div>
                    <input type="text" th:field="*{title}" placeholder="제목을 입력해주세요" class="admin-field-input">
                    <div class="admin-field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">오류</div>
                </div>
            </div>

            <div class="admin-field-row align-start">
                <span class="admin-field-label with-padding">내용</span>
                <div>
                    <textarea th:field="*{content}" rows="10" placeholder="내용을 입력해주세요" class="admin-field-textarea"></textarea>
                    <div class="admin-field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">오류</div>
                </div>
            </div>

            <div class="admin-field-row">
                <span class="admin-field-label">상단 고정</span>
                <label class="admin-checkbox-label">
                    <input type="checkbox" th:field="*{pinned}"> 목록 상단에 고정
                </label>
            </div>
        </form>
    </div>
</div>

</body>
</html>
