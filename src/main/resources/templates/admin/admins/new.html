<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 추가 - Podo Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<div class="admin-wrapper">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="admin-content">
        <form th:action="@{/admin/admins}" th:object="${form}" method="post">
            <div class="admin-content-header">
                <h2 class="admin-content-title">관리자 추가</h2>
            </div>
            <div class="admin-form-divider"></div>

            <div class="admin-card-wrap">
                <div class="admin-card-title">기본정보</div>
                <div class="admin-card">
                    <div th:replace="~{admin/fragments/avatar :: avatar(null)}"></div>

                    <div class="admin-input-group">
                        <label class="admin-input-label" for="name">이름<span class="required">*</span></label>
                        <input type="text" id="name" class="admin-input" th:field="*{name}" placeholder="이름을 입력해주세요">
                        <div class="admin-field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">에러</div>
                    </div>

                    <div class="admin-input-group">
                        <label class="admin-input-label" for="loginId">아이디<span class="required">*</span></label>
                        <div class="admin-input-row">
                            <input type="text" id="loginId" class="admin-input" th:field="*{loginId}" placeholder="아이디를 입력해주세요">
                            <button type="button" class="admin-outline-button" onclick="checkLoginId()">중복확인</button>
                        </div>
                        <div class="admin-input-hint">영문과 숫자 4~20자</div>
                        <div class="admin-check-result" id="loginIdResult"></div>
                        <div class="admin-field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">에러</div>
                    </div>

                    <div class="admin-input-group">
                        <label class="admin-input-label" for="email">이메일</label>
                        <div class="admin-input-row">
                            <input type="text" id="email" class="admin-input" th:field="*{email}" placeholder="이메일을 입력해주세요">
                            <button type="button" class="admin-outline-button" onclick="checkEmail()">중복확인</button>
                        </div>
                        <div class="admin-check-result" id="emailResult"></div>
                        <div class="admin-field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">에러</div>
                    </div>
                </div>

                <div class="admin-card-title">비밀번호</div>
                <div class="admin-card">
                    <div class="admin-input-group">
                        <label class="admin-input-label" for="password">비밀번호<span class="required">*</span></label>
                        <input type="password" id="password" class="admin-input" th:field="*{password}" placeholder="비밀번호를 입력해주세요">
                        <div class="admin-input-hint">비밀번호 (8~20자)</div>
                        <div class="admin-field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">에러</div>
                    </div>
                    <div class="admin-input-group">
                        <label class="admin-input-label" for="passwordConfirm">비밀번호 확인<span class="required">*</span></label>
                        <input type="password" id="passwordConfirm" class="admin-input" th:field="*{passwordConfirm}" placeholder="비밀번호를 한 번 더 입력해주세요">
                        <div class="admin-field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}">에러</div>
                        <div class="admin-field-error" th:if="${#fields.hasErrors('passwordMatched')}" th:errors="*{passwordMatched}">에러</div>
                    </div>
                </div>

                <div class="admin-card-actions">
                    <a th:href="@{/admin/admins}" class="admin-outline-button">취소</a>
                    <button type="submit" class="admin-primary-button">저장</button>
                </div>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/admin-user-check.js}"></script>
</body>
</html>
